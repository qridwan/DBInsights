services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbinsight}
      POSTGRES_DB: ${POSTGRES_DB:-dbinsight}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ecommerce:
    build:
      context: .
      dockerfile: apps/ecommerce/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dbinsight}:${POSTGRES_PASSWORD:-dbinsight}@postgres:5432/ecommerce
    ports:
      - "${ECOMMERCE_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  blog:
    build:
      context: .
      dockerfile: apps/blog/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dbinsight}:${POSTGRES_PASSWORD:-dbinsight}@postgres:5432/blog
    ports:
      - "${BLOG_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
