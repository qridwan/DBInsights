services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbinsight}
      POSTGRES_DB: ${POSTGRES_DB:-dbinsight}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ecommerce:
    build:
      context: .
      dockerfile: apps/ecommerce/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dbinsight}:${POSTGRES_PASSWORD:-dbinsight}@postgres:5432/ecommerce
      # Runtime query collection; set DBINSIGHT_COLLECTOR_URL= (empty) to switch it off.
      DBINSIGHT_COLLECTOR_URL: ${DBINSIGHT_COLLECTOR_URL-http://collector:8700/v1/operations}
    ports:
      - "${ECOMMERCE_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  blog:
    build:
      context: .
      dockerfile: apps/blog/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dbinsight}:${POSTGRES_PASSWORD:-dbinsight}@postgres:5432/blog
      # Runtime query collection; set DBINSIGHT_COLLECTOR_URL= (empty) to switch it off.
      DBINSIGHT_COLLECTOR_URL: ${DBINSIGHT_COLLECTOR_URL-http://collector:8700/v1/operations}
    ports:
      - "${BLOG_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: services
    environment:
      DBINSIGHT_RESULTS_DATABASE_URL: postgresql://${POSTGRES_USER:-dbinsight}:${POSTGRES_PASSWORD:-dbinsight}@postgres:5432/${POSTGRES_DB:-dbinsight}
    ports:
      - "${COLLECTOR_PORT:-8700}:8700"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development mail catcher: the dashboard's verification and reset emails land here.
  # Set DBINSIGHT_SMTP_HOST=localhost DBINSIGHT_SMTP_PORT=1025 on the dashboard API, read them at :8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
