<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DBInsight</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="6" rx="7" ry="3" /><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6" /><path d="M3 19h4l2-3 3 5 2-4 1 2h6" />
        </svg>
      </div>
      <h1 id="title">Starting DBInsight</h1>
      <p class="sub" id="subtitle">Getting the database, the API and the dashboard ready.</p>

      <ul class="steps" id="steps" aria-live="polite">
        <li class="waiting" data-step="database"><span class="dot"></span><span class="name">Database<span class="detail">PostgreSQL and the local mail inbox</span></span></li>
        <li class="waiting" data-step="api"><span class="dot"></span><span class="name">Analysis API<span class="detail">Scans, accounts and findings</span></span></li>
        <li class="waiting" data-step="dashboard"><span class="dot"></span><span class="name">Dashboard<span class="detail">The interface you use</span></span></li>
      </ul>

      <div class="actions" id="actions">
        <button class="primary" id="retry">Try again</button>
        <button id="logs">Show details</button>
        <button id="folder">Choose the DBInsight folder…</button>
        <button id="openlogs">Open logs folder</button>
      </div>
      <pre id="logview"></pre>
      <p class="home-note" id="homenote"></p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
