[package]
name = "dbinsight-desktop"
version = "0.1.0"
description = "Native desktop shell for DBInsight"
authors = ["DBInsight"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dbinsight_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
